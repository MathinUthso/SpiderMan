services:
  - type: web
    name: gridwise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_TIMEOUT_S
        value: "12"
      - key: INTERPRET_BUDGET_S
        value: "22"
      - key: LOG_LEVEL
        value: INFO
